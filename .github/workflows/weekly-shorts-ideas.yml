name: QuantaTale weekly Shorts ideas

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays at 09:00 Africa/Kampala.
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/weekly-shorts-ideas.yml"
      - ".github/scripts/build_weekly_ideas.py"

permissions:
  contents: read

concurrency:
  group: quantatale-weekly-shorts-ideas
  cancel-in-progress: false

jobs:
  create-idea-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install QuantaTale
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate weekly idea builder syntax
        run: python -m py_compile .github/scripts/build_weekly_ideas.py

      - name: Discover fresh story leads
        run: quantatale discover --limit 100 --output build/weekly-discovery.json

      - name: Retrieve registered publisher pages and extract claim candidates
        run: quantatale research-candidates build/weekly-discovery.json --limit 50 --output build/weekly-research-candidates.json

      - name: Build five research-led Shorts idea drafts
        run: python .github/scripts/build_weekly_ideas.py

      - name: Add idea pack to workflow summary
        if: always()
        run: |
          if [ -f build/weekly-shorts-ideas.md ]; then
            cat build/weekly-shorts-ideas.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Weekly Shorts ideas" >> "$GITHUB_STEP_SUMMARY"
            echo "A complete five-idea pack could not be produced from five distinct, sufficiently sourced candidates. No unsupported ideas were added." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload weekly ideas and research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quantatale-weekly-shorts-ideas-${{ github.run_id }}
          path: |
            build/weekly-discovery.json
            build/weekly-research-candidates.json
            build/weekly-shorts-ideas.md
          if-no-files-found: warn
          retention-days: 90
