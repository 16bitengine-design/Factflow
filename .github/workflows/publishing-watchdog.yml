name: QuantaTale publishing watchdog
on:
  schedule:
    # Staggered checks around the noon/evening slots.
    # Push-triggered checks also recover a slot if setup latency crosses its due time.
    - cron: "*/10 8-9,14-15 * * *"
  push:
    # A watchdog code change also provides an event-driven recovery check when
    # the repository scheduler has delayed or dropped its scheduled event.
    branches: [main]
    paths:
      - ".github/workflows/publishing-watchdog.yml"
      - "src/factflow/publishing_watchdog.py"
  workflow_dispatch:
    inputs:
      publish_now:
        description: "Immediately start one safe recovery publication instead of checking a daily slot."
        required: false
        type: boolean
        default: false
permissions:
  actions: write
  contents: read
  issues: write
concurrency:
  group: quantatale-publishing-watchdog
  cancel-in-progress: false
jobs:
  detect-and-recover:
    name: Detect missing slot runs and recover safely
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the current publishing ledger
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Inspect slot and recover only when no attempt exists
        env:
          PUBLISH_NOW: ${{ github.event.inputs.publish_now || 'false' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          PYTHONPATH=src python - <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          from factflow.publishing_watchdog import find_recovery_entry, find_slot_entry, slot_entry_state, upcoming_slot

          repo = os.environ['GH_REPO']
          now = datetime.now(timezone.utc)
          immediate = os.environ.get('PUBLISH_NOW', 'false').lower() == 'true'
          due = None if immediate else upcoming_slot(now)
          if not immediate and due is None:
              print(f'No publishing slot is inside its recovery window at {now.isoformat()}.')
              raise SystemExit(0)

          ledger_path = Path('production/publishing-ledger.json')
          ledger = json.loads(ledger_path.read_text(encoding='utf-8')) if ledger_path.exists() else {}
          slot_entry = find_slot_entry(ledger, due) if due is not None else None
          if slot_entry is None and due is not None and due.astimezone(timezone.utc) <= now:
              slot_entry = find_recovery_entry(ledger, due)
              if slot_entry:
                  print(f"Found existing immediate-recovery reservation {slot_entry[0]} for the missed slot.")

          runs_raw = subprocess.check_output([
              'gh', 'api', f'repos/{repo}/actions/workflows/buffer-production-publish.yml/runs?per_page=30'
          ], text=True)
          runs = json.loads(runs_raw).get('workflow_runs', [])
          active = [run for run in runs if run.get('status') in {'queued', 'in_progress'}]
          if active:
              print('A production workflow is already active; waiting rather than dispatching a duplicate.')
              for run in active[:5]:
                  print(f"Active run {run.get('id')}: {run.get('status')} ({run.get('html_url')})")
              raise SystemExit(0)

          if immediate:
              payload = json.dumps({'ref': 'main', 'inputs': {'publish_now': 'true'}})
              subprocess.run([
                  'gh', 'api', '-X', 'POST',
                  f'repos/{repo}/actions/workflows/buffer-production-publish.yml/dispatches',
                  '--input', '-'
              ], input=payload, text=True, check=True)
              print('Dispatched one immediate recovery production run.')
              raise SystemExit(0)

          if slot_entry:
              content_id, entry = slot_entry
              entry_state = slot_entry_state(entry)
              if entry_state == 'scheduled':
                  print(f'{content_id} already has Buffer post IDs for both platforms; no recovery needed.')
                  raise SystemExit(0)
              if entry_state == 'cancelled':
                  print(f'{content_id} was intentionally cancelled; no automatic retry will be attempted.')
                  raise SystemExit(0)
              title = f"QuantaTale publishing slot blocked: {due.strftime('%Y-%m-%d %H:%M')} Africa/Kampala"
              body = (
                  f"The watchdog found a ledger reservation for `{content_id}` at `{due.isoformat()}`, "
                  f"but no active production run and no complete pair of Buffer post IDs.\n\n"
                  f"Current ledger status: `{entry.get('status', 'unknown')}`.\n\n"
                  "Automatic redispatch was deliberately withheld because a partial Buffer operation may already "
                  "have created a public post. Inspect the production run and Buffer before clearing or retrying "
                  "this reservation; this fail-closed behavior prevents duplicate publication.\n\n"
                  "This issue is an operational alert, not proof that either platform published."
              )
              existing = subprocess.check_output([
                  'gh', 'issue', 'list', '--state', 'open', '--json', 'title', '--jq', '.[].title'
              ], text=True).splitlines()
              if title not in existing:
                  subprocess.run(['gh', 'issue', 'create', '--title', title, '--body', body], check=True)
                  print('Created an operational alert because the reservation is unsafe to retry.')
              else:
                  print('The operational alert for this blocked slot is already open.')
              raise SystemExit(0)

          print(f'No ledger reservation exists for {due.isoformat()} and no production run is active.')
          if due.astimezone(timezone.utc) <= now:
              payload = json.dumps({'ref': 'main', 'inputs': {'publish_now': 'true'}})
              subprocess.run([
                  'gh', 'api', '-X', 'POST',
                  f'repos/{repo}/actions/workflows/buffer-production-publish.yml/dispatches',
                  '--input', '-'
              ], input=payload, text=True, check=True)
              print('Dispatched an immediate production recovery for the missed slot.')
          else:
              subprocess.run([
                  'gh', 'api', '-X', 'POST',
                  f'repos/{repo}/actions/workflows/buffer-production-publish.yml/dispatches',
                  '-f', 'ref=main'
              ], check=True)
              print('Dispatched the production workflow for the upcoming slot.')
          PY
