name: FactFlow CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: factflow-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test, validate, assess evidence and discover leads
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run automated tests
        run: python -m pytest

      - name: Validate sample topic
        run: factflow validate examples/topics/why-the-sky-is-blue.json

      - name: Generate evidence assessment report
        run: |
          mkdir -p build
          factflow research-report examples/topics/why-the-sky-is-blue.json --output build/research-report.json

      - name: Discover candidate story leads
        run: factflow discover --limit 30 --output build/discovery-candidates.json

      - name: Extract source-backed claim candidates
        run: factflow research-candidates build/discovery-candidates.json --limit 10 --output build/research-candidates.json

      - name: Upload discovery and research reports
        uses: actions/upload-artifact@v4
        with:
          name: factflow-stage-3-reports
          path: build/*.json
          if-no-files-found: error
          retention-days: 7
