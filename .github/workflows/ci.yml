name: FactFlow CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: factflow-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test project and validate example topic
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run automated tests
        run: python -m pytest

      - name: Validate sample topic
        run: factflow validate examples/topics/why-the-sky-is-blue.json
