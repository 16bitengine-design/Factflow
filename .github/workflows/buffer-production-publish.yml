name: QuantaTale production video scheduling

on:
  workflow_dispatch:
    inputs:
      content_spec:
        description: Select the reviewed video to publish
        required: true
        default: examples/videos/why-the-sky-is-blue-production.json
        type: choice
        options:
          - examples/videos/why-the-sky-is-blue-production.json
          - examples/videos/why-sunsets-red-production.json
      approve_publication:
        description: I reviewed this video and approve public scheduling to YouTube and TikTok
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: quantatale-production-publishing
  cancel-in-progress: false

jobs:
  schedule-video:
    name: Render and schedule approved video
    if: ${{ inputs.approve_publication }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Reject workflow reruns to avoid duplicate posts
        if: ${{ github.run_attempt != 1 }}
        run: |
          echo "::error::This production workflow cannot be rerun. Check Buffer before any new attempt."
          exit 1
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install free rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg espeak-ng fonts-dejavu-core
      - name: Cache Kokoro model files
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: kokoro-82m-af-heart-v1
      - name: Install QuantaTale and publishing dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,render,tts]"
          python -m pip install "cloudinary>=1.44,<2"
      - name: Run complete automated test suite
        run: python -m pytest -v
      - name: Load the saved production settings
        env:
          CONTENT_SPEC: ${{ inputs.content_spec }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo

          spec = json.loads(Path(os.environ["CONTENT_SPEC"]).read_text(encoding="utf-8"))
          publish_time = spec["publish_time_local"]
          timezone_name = spec["publish_timezone"]
          prefix = spec["content_id_prefix"]
          zone = ZoneInfo(timezone_name)
          now = datetime.now(zone)
          scheduled = datetime.combine(now.date(), datetime.strptime(publish_time, "%H:%M").time(), tzinfo=zone)
          if scheduled <= now + timedelta(minutes=5):
              scheduled += timedelta(days=1)
          content_id = f"{prefix}-{scheduled:%Y%m%d}"
          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as handle:
              handle.write(f"title={spec['post_title']}\n")
              handle.write(f"description={spec['post_description']}\n")
              handle.write(f"content_id={content_id}\n")
              handle.write(f"due_at={scheduled.isoformat(timespec='seconds')}\n")
          print(f"Loaded: {spec['post_title']}")
          print(f"Scheduled slot: {scheduled.isoformat(timespec='seconds')}")
          print(f"Content ID: {content_id}")
          PY
      - name: Render selected production video
        env:
          CONTENT_SPEC: ${{ inputs.content_spec }}
        run: quantatale render-sample "$CONTENT_SPEC" --output-dir build/production-video
      - name: Schedule public video through Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_YOUTUBE_CHANNEL_ID: ${{ secrets.BUFFER_YOUTUBE_CHANNEL_ID }}
          BUFFER_TIKTOK_CHANNEL_ID: ${{ secrets.BUFFER_TIKTOK_CHANNEL_ID }}
          BUFFER_YOUTUBE_CATEGORY_ID: ${{ vars.BUFFER_YOUTUBE_CATEGORY_ID }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          CONTENT_ID: ${{ steps.load_settings.outputs.content_id }}
          DUE_AT: ${{ steps.load_settings.outputs.due_at }}
          POST_TITLE: ${{ steps.load_settings.outputs.title }}
          POST_DESCRIPTION: ${{ steps.load_settings.outputs.description }}
        run: |
          python -m factflow.buffer_schedule \
            --video build/production-video/quantatale-sample-vertical.mp4 \
            --target both \
            --content-id "$CONTENT_ID" \
            --due-at "$DUE_AT" \
            --title "$POST_TITLE" \
            --description "$POST_DESCRIPTION"
      - name: Upload production review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quantatale-production-${{ github.run_id }}
          path: |
            build/production-video/quantatale-sample-vertical.mp4
            build/production-video/thumbnail.png
            build/production-video/captions.srt
            build/production-video/sample-metadata.json
          if-no-files-found: warn
          retention-days: 7
