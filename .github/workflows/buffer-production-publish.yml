name: QuantaTale hands-off video publishing
on:
  schedule:
    # Retry safely during each pre-publication window. The selector and ledger
    # make repeated invocations idempotent for each local publishing slot.
    - cron: "30,35,40,45,50,55 8,14 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: quantatale-production-publishing
  cancel-in-progress: false
jobs:
  publish-next-video:
    name: Select, render and schedule the next approved video
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install free rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg espeak-ng fonts-dejavu-core
      - name: Cache Kokoro model files
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: kokoro-82m-af-heart-v1
      - name: Install QuantaTale and publishing dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,render,tts]"
          python -m pip install "cloudinary>=1.44,<2"
      - name: Run complete automated test suite
        run: python -m pytest -v
      - name: Automatically select the next distinct approved daily slot
        id: select
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          from factflow.publishing_slots import select_next_slot

          library_path = Path("production/topic-library.json")
          library = json.loads(library_path.read_text(encoding="utf-8")) if library_path.exists() else {}
          ledger_path = Path("production/publishing-ledger.json")
          ledger_path.parent.mkdir(parents=True, exist_ok=True)
          ledger = json.loads(ledger_path.read_text(encoding="utf-8")) if ledger_path.exists() else {}
          selection = select_next_slot(library, ledger, now=datetime.now(timezone.utc))
          output = Path(os.environ["GITHUB_OUTPUT"])
          if selection is None:
              output.write_text("selected=false\n", encoding="utf-8")
              print("This run is outside the 30-minute window for a configured publishing slot.")
              raise SystemExit(0)

          spec_path = Path(selection["spec_path"])
          spec = json.loads(spec_path.read_text(encoding="utf-8"))
          content_id = selection["content_id"]
          ledger[content_id] = {
              "status": "reserved",
              "spec": str(spec_path),
              "due_at": selection["due_at"],
              "reserved_at": datetime.now(timezone.utc).isoformat(timespec="seconds"),
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "slot_local": selection["slot_local"],
          }
          ledger_path.write_text(json.dumps(ledger, indent=2) + "\n", encoding="utf-8")
          with output.open("a", encoding="utf-8") as handle:
              handle.write("selected=true\n")
              handle.write(f"spec={spec_path}\n")
              handle.write(f"content_id={content_id}\n")
              handle.write(f"due_at={selection['due_at']}\n")
              handle.write(f"title={selection['post_title']}\n")
              handle.write(f"description={selection['post_description']}\n")
          print(f"Selected distinct topic: {selection['post_title']}")
          print(f"Content ID: {content_id}")
          print(f"Uganda publishing slot: {selection['slot_local']}")
          PY
      - name: Persist duplicate-prevention reservation
        if: steps.select.outputs.selected == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add production/publishing-ledger.json
          git commit -m "Reserve daily QuantaTale publishing slot"
          git push origin HEAD:main
      - name: Render automatically selected video
        if: steps.select.outputs.selected == 'true'
        env:
          CONTENT_SPEC: ${{ steps.select.outputs.spec }}
        run: quantatale render-sample "$CONTENT_SPEC" --output-dir build/production-video
      - name: Schedule public video through Buffer
        if: steps.select.outputs.selected == 'true'
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_YOUTUBE_CHANNEL_ID: ${{ secrets.BUFFER_YOUTUBE_CHANNEL_ID }}
          BUFFER_TIKTOK_CHANNEL_ID: ${{ secrets.BUFFER_TIKTOK_CHANNEL_ID }}
          BUFFER_YOUTUBE_CATEGORY_ID: ${{ vars.BUFFER_YOUTUBE_CATEGORY_ID }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          CONTENT_ID: ${{ steps.select.outputs.content_id }}
          DUE_AT: ${{ steps.select.outputs.due_at }}
          POST_TITLE: ${{ steps.select.outputs.title }}
          POST_DESCRIPTION: ${{ steps.select.outputs.description }}
        run: |
          python -m factflow.buffer_schedule \
            --video build/production-video/quantatale-sample-vertical.mp4 \
            --target both \
            --content-id "$CONTENT_ID" \
            --due-at "$DUE_AT" \
            --title "$POST_TITLE" \
            --description "$POST_DESCRIPTION" \
            --results-file build/buffer-schedule-results.json
      - name: Persist any Buffer post IDs, including partial success
        if: always() && steps.select.outputs.selected == 'true'
        env:
          CONTENT_ID: ${{ steps.select.outputs.content_id }}
        run: |
          if [ ! -s build/buffer-schedule-results.json ]; then
            echo "No Buffer post IDs were returned; reservation remains fail-closed."
            exit 0
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          ledger_path = Path("production/publishing-ledger.json")
          ledger = json.loads(ledger_path.read_text(encoding="utf-8"))
          results = json.loads(Path("build/buffer-schedule-results.json").read_text(encoding="utf-8"))
          entry = ledger[os.environ["CONTENT_ID"]]
          posts = entry.setdefault("buffer_posts", {})
          for item in results:
              posts[item["target"]] = {
                  "post_id": item["post_id"],
                  "buffer_status": item["status"],
                  "due_at": item["due_at"],
                  "verification": {"status": "awaiting_confirmation"}
              }
          ledger_path.write_text(json.dumps(ledger, indent=2) + "\n", encoding="utf-8")
          PY
          if git diff --quiet -- production/publishing-ledger.json; then
            echo "No partial Buffer IDs to persist."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add production/publishing-ledger.json
          git commit -m "Persist Buffer post identifiers for daily slot"
          git push origin HEAD:main
      - name: Mark publishing slot as scheduled
        if: success() && steps.select.outputs.selected == 'true'
        env:
          CONTENT_ID: ${{ steps.select.outputs.content_id }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          path = Path("production/publishing-ledger.json")
          ledger = json.loads(path.read_text(encoding="utf-8"))
          results = json.loads(Path("build/buffer-schedule-results.json").read_text(encoding="utf-8"))
          if not results or any(not item.get("post_id") for item in results):
              raise SystemExit("Buffer returned incomplete post identifiers; refusing to mark scheduled.")
          entry = ledger[os.environ["CONTENT_ID"]]
          entry["status"] = "scheduled"
          entry["scheduled_at"] = datetime.now(timezone.utc).isoformat()
          posts = entry.setdefault("buffer_posts", {})
          for item in results:
              posts[item["target"]] = {
                  "post_id": item["post_id"],
                  "buffer_status": item["status"],
                  "due_at": item["due_at"],
                  "verification": {"status": "awaiting_confirmation"}
              }
          if not all(posts.get(platform, {}).get("post_id") for platform in ("youtube", "tiktok")):
              raise SystemExit("Both YouTube and TikTok post IDs are required before marking scheduled.")
          ledger[os.environ["CONTENT_ID"]] = entry
          path.write_text(json.dumps(ledger, indent=2) + "\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add production/publishing-ledger.json
          git commit -m "Record scheduled QuantaTale daily slot"
          git push origin HEAD:main
      - name: Upload production evidence
        if: always() && steps.select.outputs.selected == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: quantatale-production-${{ github.run_id }}
          path: |
            build/production-video/quantatale-sample-vertical.mp4
            build/production-video/thumbnail.png
            build/production-video/captions.srt
            build/production-video/sample-metadata.json
          if-no-files-found: warn
          retention-days: 7
